  :root{
    --bg:#000000;
    --ink:#efeee7;
    --dim:rgba(239,238,231,.46);
    --faint:rgba(239,238,231,.22);
    --valid:#5fca8d;
    --fs:clamp(12px,1.6vh,19px);   /* on-site knob: raise the 19px cap for large/4K screens or distant viewing */
    --measure:116ch;               /* readable column width; the ledger never stretches wider than this */
  }
  *{box-sizing:border-box;margin:0;}
  html,body{height:100%;background:var(--bg);}
  body{
    color:var(--ink);
    font-family:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .app{
    width:100vw;height:100vh;height:100svh;
    font-size:var(--fs);
    padding:clamp(20px,3vh,46px) clamp(24px,3.4vw,66px);
    display:flex;flex-direction:column;align-items:center;overflow:hidden;
  }
  .feed{
    width:100%;max-width:var(--measure);      /* centered column — stays legible on 4K / ultrawide */
    flex:1;min-height:0;
    display:flex;flex-direction:column;gap:1.2em;overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);
            mask-image:linear-gradient(to bottom,#000 80%,transparent 100%);
  }
  .blk{padding-top:.1em;}
  .blk .h{color:var(--ink);letter-spacing:.02em;}
  .blk .h .n{font-weight:700;}
  .rows{margin-top:.5em;display:flex;flex-direction:column;gap:.34em;}
  .row{display:grid;grid-template-columns:5.4em 1fr auto;gap:1.2em;align-items:baseline;}
  .row .lbl{color:var(--ink);}
  .row .mid{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mid .tgt{color:var(--ink);}          /* the mined prefix — later, the novel */
  .mid .tail{color:var(--faint);}       /* proof-of-work body */
  .vd{white-space:nowrap;letter-spacing:.02em;text-align:right;color:var(--valid);opacity:.82;}
</style>
</head>
<body>
  <main class="app" id="app">
    <div class="feed" id="feed"></div>
  </main>

<style>
  .row .flag{color:#e0613f;opacity:.9;letter-spacing:.02em;}
  .mid .glyph{color:var(--valid);margin-left:.6em;}
</style>
<script>
"use strict";
/* Exhibition display — the REAL assumevalid chain, in the demo's ledger form.
   New blocks appear as the node mines; the block-hash's leading byte is the
   novel character being written; coinbase and the (impossible) transactions the
   node relays without checking are shown, each blessed "assume valid".
   Reads a local read-only API (explorer-api.py). Pi kiosk: ?api=http://localhost:8080 */
const API = new URLSearchParams(location.search).get("api") || "https://api.assumevalid.org";
const feed = document.getElementById("feed");
const MAX_DOM = 15, CAP = 21000000;

const api = (p) => fetch(API + p, { cache: "no-store" }).then(r => r.json()).then(j => { if (j && j.error) throw new Error(j.error); return j; });
const esc = (s) => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const btc = (v) => (v || 0).toLocaleString("en-US", { minimumFractionDigits: 8, maximumFractionDigits: 8 });
const shortAddr = (a) => (a && a.length > 18) ? a.slice(0, 10) + "…" + a.slice(-4) : (a || "—");
const subsidyAt = (h) => 50 / Math.pow(2, Math.floor(h / 210000));
function decodeGlyph(hash) { const c = parseInt(hash.slice(0, 2), 16); if (c === 32) return "␣"; if (c >= 33 && c <= 126) return String.fromCharCode(c); return ""; }
function destOf(o) { const s = o.scriptPubKey || {}; if (s.address) return s.address; if (s.type === "nulldata") return "OP_RETURN"; if (s.type === "nonstandard" && /\bOP_TRUE\b|^1$/.test(s.asm || "")) return "anyone"; return s.type || "?"; }

function linesFor(b) {
  const lines = [];
  lines.push({ label: "hash", mid: '<span class="tgt">' + b.hash.slice(0, 2) + '</span><span class="tail">' + b.hash.slice(2) + '</span>' });
  const sub = subsidyAt(b.height);
  (b.tx || []).forEach((t) => {
    const cb = t.vin && t.vin[0] && t.vin[0].coinbase;
    const outs = (t.vout || []).filter((o) => (o.value || 0) > 0);
    const total = outs.reduce((s, o) => s + (o.value || 0), 0);
    const to = outs.length ? shortAddr(destOf(outs[0])) : "—";
    const flags = [];
    if (outs.some((o) => (o.value || 0) > CAP)) flags.push("over cap");
    if (cb) { if (total > sub + 1e-8) flags.push("over issuance"); lines.push({ label: "coinbase", mid: "+" + btc(total) + "  → " + esc(to), flags }); }
    else lines.push({ label: "send", mid: btc(total) + "  → " + esc(to), flags });
  });
  return lines;
}

function build(b) {
  const el = document.createElement("div"); el.className = "blk";
  const h = document.createElement("div"); h.className = "h";
  h.innerHTML = '<span class="n">block ' + String(b.height).padStart(6, "0") + '</span>';
  el.appendChild(h);
  const rows = document.createElement("div"); rows.className = "rows";
  for (const ln of linesFor(b)) {
    const r = document.createElement("div"); r.className = "row";
    const flags = (ln.flags && ln.flags.length) ? ' <span class="flag">' + ln.flags.map(esc).join(" · ") + '</span>' : '';
    r.innerHTML = '<span class="lbl">' + ln.label + '</span><span class="mid">' + ln.mid + flags + '</span>'
      + '<span class="vd">✓ assume valid</span>';
    rows.appendChild(r);
  }
  el.appendChild(rows);
  feed.insertBefore(el, feed.firstChild);
  while (feed.childElementCount > MAX_DOM) feed.removeChild(feed.lastChild);
}

let lastTip = -1, busy = false;
async function poll() {
  if (busy) return; busy = true;
  try {
    const tip = (await api("/api/status")).blocks;
    if (lastTip < 0) {
      const r = await api("/api/blocks?count=" + MAX_DOM);
      for (const meta of r.blocks.slice().reverse()) build(await api("/api/block/" + meta.height));
      lastTip = tip;
    } else if (tip > lastTip) {
      for (let h = lastTip + 1; h <= tip; h++) build(await api("/api/block/" + h));
      lastTip = tip;
    }
  } catch (e) { /* hold the last frame through a hiccup */ }
  busy = false;
}
poll();
setInterval(poll, 2000);
</script>
