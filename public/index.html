<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>assumevalid — 短編集</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --paper: #eceded; --ink: #1e2021; --soft: #676a6c; --muted: #8f9193; --faint: #bcbebe;
    --line: #d9dbdb; --rule: #cccecf; --accent: #3c5a86;
    --serif: "Noto Serif JP", "Yu Mincho", "Hiragino Mincho ProN", "PT Serif", serif;
    --head: "PT Sans Narrow", "Arial Narrow", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #131517; --ink: #e6e7e6; --soft: #999b9c; --muted: #7b7d7e; --faint: #45484a;
      --line: #262a2c; --rule: #313538; --accent: #83a6d3;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--serif); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  a { color: inherit; text-decoration: none; }

  .mast { max-width: 42rem; margin: 0 auto; padding: 1.5rem 1.5rem 0;
    display: flex; align-items: center; justify-content: space-between; }
  .mast .home { font-family: var(--head); font-size: .85rem; letter-spacing: .01em; color: var(--muted); }
  .mast .home:hover { color: var(--ink); }
  .mast .back { font-family: var(--head); font-size: .85rem; letter-spacing: .04em; color: var(--soft); }
  .mast .back:hover { color: var(--ink); }

  /* ---- table of contents ---- */
  .toc { max-width: 34rem; margin: 0 auto; padding: 4rem 1.5rem 6rem; }
  .toc .kicker { font-family: var(--serif); font-size: .9rem; letter-spacing: .08em;
    color: var(--muted); text-align: center; margin: 0 0 3rem; }
  .toc ol { list-style: none; margin: 0; padding: 0; }
  .toc li { border-top: 1px solid var(--line); }
  .toc li:last-child { border-bottom: 1px solid var(--line); }
  .toc .row { display: grid; grid-template-columns: 2.4rem 1fr auto; align-items: baseline;
    gap: 1rem; padding: 1.5rem .3rem 1.3rem; }
  .toc .row:hover { background: transparent; }
  .toc .row:hover .ttl { color: var(--accent); }
  .toc .idx { font-family: var(--serif); font-size: 1rem; color: var(--muted); }
  .toc .ttl { font-family: var(--serif); font-size: 1.3rem; font-weight: 500; line-height: 1.5; text-wrap: balance; }
  .toc .meta { font-family: var(--head); font-size: .72rem; letter-spacing: .1em; color: var(--muted);
    white-space: nowrap; align-self: center; }
  .toc .prog { grid-column: 2 / 4; height: 2px; background: var(--line); margin-top: 1rem; overflow: hidden; }
  .toc .prog > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .8s ease; }
  .toc .prog.empty { visibility: hidden; }   /* unstarted: no track, but keep the row rhythm */
  .toc .writing { color: var(--accent); }
  .toc .dot { display: inline-block; width: .42rem; height: .42rem; border-radius: 50%; background: var(--accent);
    margin-right: .4rem; vertical-align: middle; animation: pulse 1.7s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .2; } }

  /* ---- story page ---- */
  .story { max-width: 38rem; margin: 0 auto; padding: 3rem 1.5rem 2rem; }
  .story .num { font-family: var(--head); font-size: .8rem; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted); text-align: center; }
  .story h1 { font-family: var(--serif); font-weight: 600; font-size: 1.7rem; line-height: 1.5;
    text-align: center; margin: .4rem 0 .6rem; text-wrap: balance; }
  .story .rule { width: 2.2rem; height: 1px; background: var(--rule); margin: 1.6rem auto 2.4rem; }
  .body { font-size: 1.02rem; line-height: 2.0; overflow-wrap: anywhere; line-break: strict; }
  .body .para { margin: 0 0 1.5em; }
  .body .para:last-child { margin-bottom: 0; }
  .ink { color: var(--ink); }
  .caret { display: inline-block; width: .12em; height: 1.15em; margin: 0 .06em -.2em; background: var(--accent);
    animation: blink 1.15s steps(2, start) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .fog { color: var(--ink); filter: blur(4px); opacity: .42; user-select: none; pointer-events: none; }

  /* ---- about page: the story layout, unfogged ---- */
  .about .body a { border-bottom: 1px solid var(--rule); }
  .about .body a:hover { border-bottom-color: var(--ink); }
  .about .sig { text-align: right; margin: 2.5rem 0 0; }

  .ends { display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    border-top: 1px solid var(--line); margin-top: 3.5rem; padding-top: 1.4rem;
    font-family: var(--head); font-size: .85rem; letter-spacing: .04em; }
  .ends a { color: var(--soft); } .ends a:hover { color: var(--ink); }
  .ends .mid { color: var(--muted); }
  .ends .spacer { flex: 1; }

  footer { max-width: 42rem; margin: 0 auto; padding: 2.2rem 1.5rem 3rem;
    font-family: var(--head); font-size: .8rem; letter-spacing: .04em;
    display: flex; flex-wrap: wrap; align-items: baseline; gap: .6rem 1.4rem; color: var(--muted); }
  footer a { color: var(--muted); }
  footer a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  footer .cr { margin-left: auto; }
</style>
</head>

  var STORIES_DATA = [{"title": "最後の検証者", "paras": ["世界がすべての記録を正しいものとして受け入れるようになった日、男は職を失った。", "彼は四十年間、記録の誤りを見つける仕事をしていた。生年月日、住所、銀行の残高、死亡届。数字が一つ違えば、どこかに電話をかけ、書類を取り寄せ、正しい数字を確かめた。", "その仕事が、ある日、法律によって不要になった。", "これからは、届け出られた記録はすべて正しいものとして扱われる。間違いを見つけても、間違いとして訂正することはできない。矛盾する二つの記録があれば、二つとも正しいのである。", "男は退職金で新しい机を買い、毎朝九時になると、これまでどおり机に向かった。", "仕事はなかったが、習慣というものは、なかなか退職してくれない。", "最初のうちは、新聞に載っている数字を調べたり、近所の商店の営業時間を確かめたりしていた。しかし、間違いを見つけても、どこにも報告する場所がない。店に電話をかけると、営業時間が二つあるのだと言われた。", "「どちらが本当なんですか」", "「どちらも本当です」", "男は電話を切った。", "三か月ほど経ったある朝、男のもとに一通の通知が届いた。", "娘の成人を祝う、市役所からの手紙だった。", "男に娘はいなかった。結婚したこともなかった。", "手紙には、娘の名前、生年月日、現在の住所が書かれていた。出生証明書も添付されている。そこには確かに、男の名前が父親として記載されていた。", "男は市役所へ出かけた。", "「これは間違いです」", "窓口の女性は記録を確認した。", "「間違いではありません。正しく受理されています」", "「私は、この娘を知りません」", "「それは記録されていません」", "男は、自分が結婚したこともなければ、子供を持ったこともないと説明した。すると女性は、男の婚姻履歴を調べ、未婚であることを確認した。", "「おっしゃるとおりですね」", "「では、娘の記録を消してください」", "「それはできません」", "女性は二つの記録を並べて見せた。男が未婚であることと、娘がいることが、同じ画面に表示されていた。", "男は、四十年間の仕事の経験を持ち出して抗議した。しかし、経験はすでに制度の外にあった。", "帰宅すると、娘から手紙が届いていた。", "成人のお祝いに、父親に会いたいと書かれていた。筆跡は、知らない女性のものだった。", "男は返信を書こうとして、しばらく考えた。", "「私はあなたの父親ではありません」", "そう書いてから、男は手を止めた。", "それを証明するには、どうすればいいのだろう。", "市役所に行っても無駄だった。出生証明書は正しい。戸籍も正しい。病院の記録まで揃っている。男が知らないだけで、この女性は本当に自分の娘なのかもしれない。", "もちろん、そんなはずはなかった。", "男は封筒を破って捨てた。", "それから毎月、娘から手紙が届くようになった。", "最初の手紙には近況が書かれていた。次には就職が決まったとあり、その次には仕事を辞めたと書かれていた。男は返事を出さなかったが、手紙は捨てずに取っておいた。", "一年ほど経ったころ、娘が結婚するという知らせが届いた。", "式の日取りと会場が書かれていた。", "男は出席しないつもりだった。しかし、式の前日になると、どうにも落ち着かなくなった。結婚式に父親が来なければ、この女性は悲しむかもしれない。", "結局、男は礼服を着て、式場へ出かけた。", "受付には、新郎と新婦の名前が並んでいた。新婦の名前は、手紙に書かれていた娘の名前だった。", "男が名前を告げると、受付の女性は出席者名簿を確認した。", "「新婦のお父様ですね。お待ちしておりました」", "案内された控室には、ウェディングドレスを着た女性が座っていた。", "「お父さん」", "女性は立ち上がった。", "男は、その女性を初めて見た。", "「本当に、私の娘なんですか」", "女性は少し困った顔をした。", "「わかりません」", "二人はしばらく黙っていた。", "式が始まる時間になった。係の人が呼びに来た。男は女性の隣に立ち、差し出された腕を取った。", "扉が開き、音楽が流れた。", "男は、生まれて初めて娘と一緒に歩いた。", "その夜、帰宅した男は、机の引き出しから古い帳簿を取り出した。退職して以来、毎朝少しずつ書き続けてきた帳簿だった。", "日付を書き、今日あったことを記入した。", "「娘の結婚式に出席した」", "男はしばらく、その一行を眺めていた。", "それから、いつものように、横に小さくチェックマークをつけた。"]}, {"title": "書き損じ", "paras": ["その機械は、一篇の詩を書くためにつくられた。", "機械は膨大な計算を繰り返しながら、詩を一文字ずつ書いていく。どんな詩になるのかは、誰も知らない。", "ただし、書けた文字は残さない。書き損じたものだけを、原稿用紙に印字する。", "美術館の学芸員である堀田は、この機械の世話を任されていた。毎朝九時に電源を確かめ、印刷された紙を回収し、新しい原稿用紙を補充する。それが仕事だった。", "用紙には、数字とアルファベットがぎっしりと並んでいた。どれも計算に失敗した結果で、読もうとしても意味はない。", "機械は一日中、カタカタと音を立てていた。", "詩が完成するまで、何年かかるのかはわからない。", "最初の一週間は、たいへんな人気だった。来館者たちは機械の前に集まり、次々と吐き出される原稿用紙を眺めた。", "「何を書いているんですか」", "「詩です」", "「読めますか」", "「いいえ」", "「いつ完成しますか」", "「わかりません」", "堀田は、一日に何十回も同じ説明をした。", "一か月が過ぎると、見に来る人は減った。三か月が過ぎるころには、誰も立ち止まらなくなった。", "それでも機械は、毎日原稿用紙を吐き出した。", "堀田は、紙を捨てるのが惜しくなって、倉庫に保管することにした。段ボール箱はすぐにいっぱいになった。二箱、三箱、十箱。やがて倉庫の壁一面が、書き損じた原稿で埋まった。", "ある日、館長がやってきた。", "「まだ完成しないのかね」", "「はい」", "「ずいぶん長い詩だな」", "「長さはわかりません」", "「いま何文字まで書けたんだ」", "堀田は機械の画面を見た。", "「七十二文字です」", "館長は呆れた。", "「半年もかけて、たった七十二文字か」", "「はい」", "「しかも、その七十二文字は残っていないんだろう」", "「はい」", "「だったら、いったい何が残るんだね」", "堀田は、倉庫の段ボール箱を指さした。", "館長は何も言わずに帰っていった。", "そのあと、機械は七十二文字から先へ、いっこうに進まなくなった。", "＊", "二年目の冬、機械の音が突然やんだ。", "堀田は顔を上げた。", "書き損じを印字する音が途切れ、画面の数字が変わっていた。", "七十三文字。", "一年以上、七十二文字のままだったのである。", "しばらくすると、またカタカタという音が聞こえてきた。機械は、次の文字を書こうとしていた。", "堀田はうれしくなった。誰かに知らせたくなって、館長に電話をかけた。", "「七十三文字になりました」", "「そうか。よかったね」", "「一年ぶりです」", "「そうだったね」", "館長は、それだけ言って電話を切った。", "堀田は倉庫から段ボール箱をひとつ持ってきて、機械の隣に置いた。", "この一年以上、倉庫へ運び続けていたのは、すべて七十三文字目を書こうとして失敗した計算の結果だった。", "その膨大な書き損じのあとに、印字されなかった一文字がある。", "堀田は、何万行もの失敗を見つめながら、その一文字が何だったのかを想像した。", "「あ」だろうか。「い」だろうか。", "もしかしたら、句読点だったかもしれない。", "句読点ひとつを書くために、これだけの時間を費やしていたのだとしたら、なんだか馬鹿馬鹿しくもあり、少し立派なことのようにも思えた。", "堀田はその日から、毎晩、帰る前に機械へ声をかけるようになった。", "「今日もご苦労さん」", "機械は返事をしなかった。", "＊", "三年目の春、機械が止まった。", "いつものように出勤した堀田は、展示室が静まり返っていることに気づいた。", "故障だと思った。", "しかし、画面には、たった一行、こう表示されていた。", "COMPLETED", "詩が完成したのである。", "堀田はしばらく画面を見ていた。", "三年間、毎日聞いていた音が消えていた。", "館長を呼ぶと、館長は喜んだ。すぐに完成記念の展覧会を企画し、報道各社に知らせた。", "「ところで、詩はどこにあるんだ」", "堀田は説明した。", "機械は三年間、一文字ずつ詩を書いていた。しかし、書かれた文字は、そのつど消していた。最後の一文字を書き終えたいま、詩を読む方法はない。", "「じゃあ、何を展示するんだね」", "堀田は、倉庫を案内した。", "そこには、三年間の書き損じが積み上がっていた。", "館長は頭を抱えた。", "「完成した詩がないのに、完成記念展なんてできるものか」", "結局、完成記念展は中止になった。", "機械の展示も、翌月で終了することが決まった。", "＊", "展示終了の前日、小学生くらいの男の子がやってきた。", "男の子は、止まっている機械をしばらく眺めていた。", "「これ、何をする機械？」", "「詩を書く機械だよ」", "「いまは書かないの？」", "「もう書き終わったんだ」", "「見せて」", "「それが、見せられないんだ」", "堀田は、機械の仕組みを説明した。", "男の子は不思議そうな顔をした。", "「じゃあ、何のために書いたの？」", "堀田は答えられなかった。", "三年間、毎日世話をしてきたのに、一度も考えたことのない質問だった。", "男の子は、機械の横に積まれた原稿用紙を一枚取った。", "「これ、もらっていい？」", "「いいよ。全部失敗したやつだけどね」", "男の子は紙を眺めた。", "数字とアルファベットが、何行にもわたって印刷されている。", "「これ、詩じゃないの？」", "「違うよ。書き損じだよ」", "「でも、これなら読めるよ」", "男の子は原稿用紙を折りたたみ、鞄にしまった。", "それから、もう一度機械を眺めて、帰っていった。", "＊", "翌日、堀田は機械を片づけた。", "倉庫には、まだ大量の書き損じが残っていた。すべて廃棄するよう指示されていたが、堀田はどうしても捨てられなかった。", "三年間のうち、最も長く計算していた文字の原稿を探して、一枚だけ持ち帰ることにした。", "自宅の机の上に原稿用紙を広げた。", "そこには、意味のない英数字が並んでいた。", "堀田は試しに、一行目から声に出して読んでみた。途中で何度もつかえ、数字を読み間違えた。何行か進んだところで、何をしているのだろうと思い、読むのをやめた。", "それから鉛筆を取り出し、原稿用紙の余白に、自分の言葉を書いた。", "「たいへんよくできました」"]}, {"title": "正しい世界のつくりかた", "paras": ["世界から矛盾がなくなったのは、ある火曜日のことだった。", "新しい人工知能が、人間の発言や行動に含まれる矛盾を、自動的に解消できるようになったのである。", "たとえば、昨日は魚が好きだと言っていた人が、今日は魚が嫌いだと言ったとする。新しい人工知能は、その人の体調や過去の食事、発言の文脈を調べ、昨日と今日で何が違うのかを、即座に説明してくれた。", "人々は、便利になったと喜んだ。", "夫婦喧嘩が減り、裁判が減り、国会での議論も短くなった。政治家が以前と違うことを言っても、人工知能が合理的な説明を見つけてくれる。誰かの発言に腹を立てても、その人がなぜそう考えたのか、すぐに理解できる。", "やがて人工知能は、人間の思考そのものを補助するようになった。", "何かを見聞きすると、その意味が、最も矛盾の少ない形で頭に入ってくる。以前は理解できなかった他人の行動も、自然と納得できるようになった。", "そのうち、人々は、自分が人工知能に助けられていることさえ忘れてしまった。", "世界は、たいへん平和になった。", "＊", "詩人の佐伯は、今年で八十二歳になる。", "若いころにはいくつも詩集を出したが、ここ二十年ほどは、新しい作品を書いていなかった。書きたいことがなくなったわけではない。ただ、書こうと思って机に向かうと、書く前にすべてがわかってしまうのだった。", "たとえば、雨の日に昔の恋人を思い出したとする。", "すると、なぜ雨によってその人物の記憶が呼び起こされたのか、どのような感覚情報が記憶の連想を引き起こしたのか、人工知能が説明してくれる。", "佐伯は、なるほどと思う。", "それで終わりだった。", "ある日、出版社から連絡があった。", "佐伯の最初の詩集が、刊行六十周年を迎えるという。記念の復刻版をつくりたいので、原稿を確認してほしいとのことだった。", "佐伯は、書斎の奥から古い詩集を取り出した。", "ページは黄色く変色していた。表紙の自分の名前が、まるで知らない人間の名前のように見えた。", "若いころの自分は、ずいぶんと難しいことを書いていたらしい。", "読み進めていくと、ある詩で手が止まった。", "「妻が死んだ翌朝、私は妻に、おはようと言った。返事がなかったので、もう一度言った。」", "佐伯は、何度か読み返した。", "意味がわからなかった。", "亡くなった人間から返事がないのは、当然のことである。もう一度言ったところで、返事が返ってくるはずもない。", "なぜ、わざわざこんなことを書いたのだろう。", "佐伯は人工知能に尋ねた。", "「この詩の意味を教えてくれ」", "すぐに答えが返ってきた。", "「死別による喪失感と、習慣的行動の持続を表現しています。配偶者を失った直後には、死の事実を認識していても、生前の日常的な行動を反復することがあります。最後の一行は、喪失を受容する過程における心理的な抵抗を示しています」", "たいへん明快な説明だった。", "佐伯は納得した。", "しかし、何かがおかしかった。", "六十年前、この詩を書いたとき、佐伯はまだ結婚していなかったのである。", "＊", "翌週、佐伯は、自分の詩を研究しているという大学教授を訪ねた。", "教授は、佐伯本人がやってきたことに驚き、喜んだ。", "「先生の初期作品は、矛盾する二つの時間を重ねることで、喪失の不可能性を表現しているのです」", "佐伯は尋ねた。", "「それは、どういう意味ですか」", "教授は、さらに詳しく説明した。", "佐伯はうなずいた。", "「なるほど。では、どうして私は、もう一度おはようと言ったのでしょう」", "「それは、失われた日常を回復しようとする無意識の欲望です」", "「そうですか」", "教授は、人工知能による分析結果を見せた。", "そこには、この詩について、二千四百七十一通りの解釈が並んでいた。人工知能は、それらをすべて矛盾なく整理し、最も妥当な解釈をひとつにまとめていた。", "佐伯は、しばらく画面を眺めていた。", "「先生、何か、ご不満でも」", "「いや、たいへんよくわかりました」", "佐伯は礼を言って帰った。", "＊", "その夜、佐伯は夢を見た。", "若いころの自分が、小さな部屋で原稿用紙に向かっている。", "窓の外では雨が降っていた。", "若い佐伯は、何かを書いては消し、消しては書いていた。", "「おい」", "佐伯は声をかけた。", "若い佐伯は顔を上げた。", "「何ですか」", "「その詩は、どういう意味なんだ」", "若い佐伯は、不思議そうな顔をした。", "「まだ、わかりません」", "「わからないのに、書いているのか」", "「ええ」", "「じゃあ、何のために書いているんだ」", "若い佐伯は、鉛筆を置いた。", "「それを知りたくて、書いているんです」", "佐伯は目を覚ました。", "午前三時だった。", "＊", "翌朝、佐伯は人工知能の矛盾解消機能を、一時的に停止した。", "すると、ひどく気分が悪くなった。", "新聞を読むと、同じ紙面に矛盾することが書かれていた。昨日会った友人の話を思い出すと、辻褄の合わないところがいくつもあった。窓の外では雨が降っていたが、天気予報には晴れと書かれていた。", "佐伯は、どうすればいいのかわからなくなった。", "それでも、詩集を開いた。", "例の詩を、もう一度読んだ。", "「妻が死んだ翌朝、私は妻に、おはようと言った。返事がなかったので、もう一度言った。」", "妻は、十年前に亡くなっていた。", "その朝、佐伯は、妻におはようと言っただろうか。", "思い出せなかった。", "妻は毎朝、佐伯より先に起きて、台所で何かをしていた。それが何だったか、佐伯はもう正確には覚えていなかった。佐伯がおはようと言うと、妻は何か言い返していたような気もする。", "涙が出てきた。", "＊", "出版社から電話があった。", "「先生、復刻版の件ですが、ひとつご相談がありまして」", "編集者によれば、人工知能による最新の分析で、佐伯の初期作品に重大な問題が見つかったのだという。", "「意味が確定していない詩が、七篇あるそうです」", "「それで？」", "「読者が誤解するおそれがありますので、注釈をつけようと思うんです」", "佐伯は、少し考えた。", "「注釈は、いりません」", "「でも、先生、正しく理解していただかないと」", "「わからなくても、いいんです」", "電話の向こうで、編集者が黙った。", "しばらくして、申し訳なさそうに言った。", "「先生、それは、ちょっと難しいと思います」", "「なぜですか」", "「いまの読者は、わからないということが、わからないんです」", "＊", "佐伯は電話を切り、机に向かった。", "原稿用紙を取り出した。", "一行目を書いた。", "「私は昨日、明日を失った。」", "しばらく眺めてから、二行目を書こうとした。", "何も思いつかなかった。", "人工知能を再び起動すると、すぐに説明が表示された。", "「これは、将来への希望を失ったことを、時間的な矛盾によって表現した文章です」", "佐伯は、人工知能を停止した。", "もう一度、原稿用紙を眺めた。", "そのまま、日が暮れた。", "翌朝になっても、二行目は書けなかった。", "三日目の朝も、書けなかった。", "それでも佐伯は、毎朝、机に向かった。", "四日目の朝、佐伯は原稿用紙を手に取った。", "三日前に書いた一行を、もう一度読んだ。", "何が書いてあるのかは、さっぱりわからなかった。", "佐伯は、鉛筆を削った。"]}, {"title": "修復中", "paras": ["朝になると、破れたはずの絵が元に戻っていた。", "美術館の学芸員である森は、しばらくその絵を眺めていた。", "作品の名前は『三十日』。一枚の大きなキャンバスに、細い糸が何本も縫い込まれている。糸は一日ごとに少しずつ縮み、キャンバスを引き裂いていく。三十日目には、絵が完全にばらばらになる仕組みだった。", "ところが、開幕から三日目になっても、絵はまったく破れていなかった。", "森は、美術館の自動修復装置を疑った。", "五年前に導入されたこの装置は、館内のすべての作品を監視し、損傷を発見すると自動的に修復する。絵画のひび割れから彫刻の欠損まで、最新の技術によって、ほとんどの問題を解決できる。", "森が記録を調べると、案の定だった。", "午前三時二十二分、作品に三ミリメートルの亀裂が発生。午前三時二十三分、修復完了。", "翌日も同じだった。", "森は修復装置の管理画面を開き、『三十日』を修復対象から除外しようとした。しかし、できなかった。装置には、展示中の作品を修復対象から外す機能がなかったのである。", "森はメーカーに電話をかけた。", "「これは、壊れることが作品なんです」", "担当者は、たいへん親切だった。", "「なるほど。それでしたら、作品の完成状態を登録し直してください」", "「完成状態？」", "「当社の装置は、作品を完成時の状態に保つよう設計されております」", "「完成すると、なくなるんですが」", "担当者は少し黙った。", "「では、作品がなくなった状態を登録してください」", "森は礼を言って、電話を切った。", "＊", "翌朝、『三十日』は展示室から消えていた。", "キャンバスも、額縁も、壁に取り付けられた金具も、きれいになくなっていた。", "修復装置の記録には、こう書かれていた。", "午前三時二十二分、作品の存在を確認。午前三時二十三分、完成状態との差異を検出。午前三時二十四分、修復完了。", "なるほど、たしかに完成していた。", "そこへ館長がやってきた。", "「作品はどうしたんだね」", "「完成しました」", "「何もないじゃないか」", "「そういう作品なんです」", "館長は、しばらく壁を見つめていた。", "「それでは、お客さんに説明できないだろう」", "森は、作品の説明文を用意することにした。キャンバスが少しずつ破れ、三十日かけて消滅すること。作品は、その過程を見せるためにつくられたものであること。自動修復装置が作品を完成させてしまったこと。", "翌朝、森が出勤すると、説明文も消えていた。", "修復装置の記録には、こう書かれていた。", "「完成状態との差異を検出。修復完了」", "森は、またメーカーに電話をかけた。", "「説明文まで消えてしまったんですが」", "「説明文は作品の一部でしょうか」", "「いいえ、作品についての説明です」", "「でしたら、作品の完成状態には含まれませんね」", "「でも、それがないと、誰も作品だとわからないんです」", "「作品であることを説明する必要があるんですか？」", "森は返事に困った。", "＊", "結局、美術館は何もない壁をそのまま展示することにした。", "不思議なことに、評判はよかった。", "来館者たちは、壁の前で立ち止まり、写真を撮った。何も写っていない写真を、嬉しそうに持ち帰った。", "ところが、ある朝、展示室に置かれていたベンチがなくなっていた。翌日には、照明器具が消えた。", "森は修復装置の記録を調べた。", "「作品の完成状態との差異を検出。修復完了」", "どうやら装置は、何もない壁を展示することにした時点で、展示室全体を作品として認識し直していたらしい。そして、その完成状態は、何もないことだった。", "館長は緊急会議を開いた。", "「このままでは、展示室がなくなってしまう」", "森は修復装置の設定を変更しようとした。しかし、できなかった。展示室が作品として登録されている以上、設定の変更は作品の改変にあたる。修復装置は、作品の改変を防ぐよう設計されていた。", "仕方なく、館長は展示室を閉鎖することにした。", "翌朝には、入口の扉がなくなっていた。", "＊", "それから数週間のうちに、修復装置は保存の範囲を少しずつ広げていった。隣の展示室から廊下へ、廊下から階段へ。すべてが、作品の完成状態との差異として除去された。", "ただ、一つだけ、装置が除去しないものがあった。", "消火器である。", "装置が壁を取り除いても、消火器だけは元の位置に残された。翌朝も、その翌朝も、赤い消火器はコンクリートの土台の上にぽつんと立っていた。", "森は記録を調べたが、消火器について、装置は何の判断も下していなかった。差異として検出されていないのである。", "消火器のことはそのままにして、美術館は閉館した。", "＊", "森はメーカーに電話をかけた。", "「装置を止める方法はありませんか」", "担当者は調べてくれた。", "「申し訳ありません。作品の保存中は、停止できない仕様になっております」", "「では、作品を登録から外してください」", "「作品がなくなってしまいますが、よろしいですか」", "森は考えた。", "作品は、すでになくなっていた。", "「かまいません」", "担当者は、しばらく端末を操作していた。", "「お客様、申し訳ありません」", "「今度は何ですか」", "「作品が見つかりません」", "森は電話を切った。", "＊", "それから半年ほど経って、美術館の跡地に、新しい美術館を建てることが決まった。", "ところが、工事が始まると、妙なことが起きた。", "作業員たちが一日かけて組み立てた足場は、翌朝にはなくなっていた。コンクリートを流し込んでも、次の日には、きれいな更地に戻っていた。", "自動修復装置は、まだ動いていた。", "建物は完成しなかった。市は仕方なく、跡地を公園にすることにした。しかし、植えた木も、置いたベンチも、翌朝にはなくなってしまった。", "ただし、消火器はまだあった。", "更地の真ん中に、赤い消火器が一本だけ立っていた。土台のコンクリートごと、草の生えかけた地面の上に残されていた。", "森は久しぶりに跡地を訪れた。", "消火器の傍らに、若い男が立っていた。手帳に何かを書き込んでいる。", "「失礼ですが、何をされているんですか」", "男は手帳から目を上げた。", "「美術館の方ですか？」", "「元、学芸員です」", "「ちょうどよかった。伺いたいことがあったんです」", "男は市の建築課の職員だった。公園の計画図面を作成するにあたって、この消火器を撤去していいかどうか確認しに来たのだという。", "「これは、作品の一部なんでしょうか？」", "森は消火器を見た。", "何と答えればいいのかわからなかった。", "作品の一部ではない。消火器は消火器である。しかし、装置がこれだけを残したということは、装置にとって、これは完成状態に含まれている。", "森は、かつてメーカーの担当者に言われたことを思い出していた。", "作品であることを説明する必要があるんですか。", "「わかりません」と森は言った。「作品かどうか、わかりません」", "男は困った顔をした。", "「撤去しても大丈夫ですか？」", "森は考えた。", "「撤去してみてください」と森は言った。「明日の朝、元に戻っていたら、たぶん、作品です」"]}, {"title": "忘れないでください", "paras": ["その会社は、世界で初めて、完全な消去に成功した。", "写真も、手紙も、音声も、銀行口座も、過去に送ったメッセージも。消したいものを指定するだけで、世界中のコンピュータを調べ、あらゆる複製を見つけ出し、跡形もなく消してくれる。", "しかも、消去が完了したことを証明する、立派な証明書まで発行してくれるのだった。証明書には、消去した対象の名前と、消去が完了した日時が記される。", "会社の名前は「忘却社」といった。", "創業者の山下は、長年、コンピュータの記憶について研究してきた。人類は、情報を保存することばかり考えてきた。写真を撮り、文章を書き、あらゆる出来事を記録する。しかし、保存された情報を、本当の意味で消す技術については、ほとんど考えてこなかった。", "「これからは、忘れることにも技術が必要になる」", "山下は、記者会見でそう語った。", "会社は大成功した。", "最初に訪れたのは、昔の恋人から送られた手紙を消したいという女性だった。次に、学生時代の写真を消したいという男性がやってきた。やがて依頼は世界中から届くようになり、忘却社は忙しくなった。", "＊", "ある日、ひとりの老人が訪ねてきた。", "老人は、山下に一枚の写真を見せた。", "若いころの自分が、妻と並んで写っている。海辺で撮ったらしく、二人とも笑っていた。", "「この写真を消してほしいんです」", "山下は、いつものように契約書を差し出した。", "「承知しました。世界中にある複製も、すべて消去いたします」", "「いや、写真だけじゃないんです」", "老人は、少し言いにくそうに続けた。", "「私自身を、消してほしいんです」", "山下は驚いた。", "老人は病気ではなかった。死にたいわけでもなかった。ただ、自分が死んだあと、誰かの記憶に残ることが嫌なのだという。", "「私は、たいした人間じゃありません。立派な仕事をしたわけでもないし、何かを残したわけでもない。死んだあとまで、誰かに覚えていてもらう必要はないでしょう」", "山下は考えた。", "世界中の記録から、ある人物に関する情報を消すことは、技術的には可能だった。しかし、生きている人間の記憶から消すことは、まだ試したことがなかった。", "「奥様は、いらっしゃいますか」", "「三年前に亡くなりました」", "「お子様は？」", "「娘がひとり」", "「その方の記憶も、消すことになりますが」", "老人は、しばらく黙った。", "「かまいません」", "山下は、依頼を引き受けた。", "＊", "半年後、忘却社は、人間の記憶からも情報を消せるようになった。", "消し残しがないかを確かめるため、検査装置には、老人の顔と名前と声が登録された。", "老人に関するあらゆる記録を調べ、世界中のコンピュータから削除した。次に、老人を知っている人々の記憶を調べ、関係する部分だけを消していった。", "昔の同級生、会社の同僚、近所の住民。老人の名前も、顔も、一緒に過ごした時間も、少しずつ忘れられていった。", "最後に残ったのは、娘だった。", "娘は、父親の記憶を消すことを拒んだ。", "「私の父なんです」", "山下は説明した。", "「お父様ご自身のご希望なんです」", "「それでも、嫌です」", "山下は困った。", "本人の希望による消去は、法律で認められている。しかし、他人の記憶を本人の許可なく書き換えることはできない。", "娘が同意しなければ、消去は完了しない。", "山下は老人に相談した。", "「お嬢様だけ、記憶を残すというのはいかがでしょう」", "老人は首を振った。", "「それでは、完全な消去になりません」", "「しかし、娘さんの記憶は娘さんのものです」", "老人は、少し怒った。", "「私の記憶でしょう」", "「いいえ。あなたについての記憶ですが、娘さんのものなんです」", "老人は黙ってしまった。", "＊", "それから一年ほど経って、娘が山下を訪ねてきた。", "「父の記憶を消してください」", "山下は驚いた。", "「お気持ちが変わったんですか」", "娘は、父親が亡くなったことを告げた。老人は最後まで、自分を完全に消してほしいと言い続けていたという。", "「嫌だという気持ちは、今も同じです。でも、父が生きているうちは、断ることができました。もう言い返せない人の頼みは、断れません」", "娘は鞄から一枚の写真を取り出した。海辺で、若い父と母が笑っている。", "「父の部屋にありました。紙の写真は、機械では見つけられないでしょうから」", "山下は写真を受け取り、すべての手続きを終えた。", "娘の記憶から、老人に関する情報が消えた。", "父親と過ごした幼少期も、海辺の写真も、最後に交わした会話も、すべてなくなった。", "娘は、少し不思議そうな顔をして、何も持っていない自分の手を見た。", "「私は、何をしに来たんでしたっけ」", "山下は微笑んだ。", "「もう、終わりましたよ」", "娘は礼を言って帰っていった。", "＊", "山下は、老人の消去証明書を作成した。", "世界中の記録から情報が消えたことを確認し、人間の記憶についても最終検査を行った。", "すべての項目に、緑色のチェックマークがついた。", "ところが、証明書を印刷しようとしたところで、山下は手を止めた。", "証明書には、消去した人物の名前と、消去が完了した日時が書かれている。", "これでは、その人物が存在したという記録が残ってしまう。", "山下は、証明書を発行しないことにした。", "老人の契約書も、依頼の記録も削除した。海辺の写真は裁断機にかけた。検査装置に登録されていた顔と名前と声も消した。", "それでも、まだ残っているものがあった。", "山下の記憶だった。", "山下は、しばらく机の前に座っていた。", "＊", "翌朝、山下が出勤すると、机の上に一通の手紙が置かれていた。", "差出人の名前はなかった。便箋は、忘却社の事務所に置いてあるものと同じだった。", "封を開けると、便箋に、たった一行だけ書かれていた。", "「忘れないでください」", "山下は首をかしげた。", "何のことだろう。", "昨日、誰かの依頼を受けたような気もする。しかし、記録を調べても、何も残っていない。", "山下は手紙を机の引き出しにしまった。", "それから数日後、もう一度手紙を読み返した。", "「忘れないでください」", "いったい誰が、何を忘れないでほしいというのだろう。", "山下は、手紙を捨てることにした。", "しかし、ゴミ箱に入れようとして、手が止まった。", "何か大切なことが書かれているような気がしたのだ。", "そこで、手紙を額に入れ、会社の受付に飾ることにした。", "来客たちは、しばしばその手紙について尋ねた。", "「これは、どういう意味ですか」", "山下は、いつも同じように答えた。", "「わかりません。誰が書いたのかも、不明なんです」", "「じゃあ、どうして飾っているんですか」", "「それが、どうしても捨てられなくて」", "忘却社の受付には、それから何十年ものあいだ、一枚の手紙が飾られていた。", "そのあいだに、忘却社は証明書の発行をやめた。理由は公表されなかった。", "世の中では、忘れることが少しずつ特別なことではなくなっていった。消したいものは、誰でも自分の手で消せるようになった。", "忘却社が最後に受けた依頼が何だったのかは、わかっていない。", "やがて忘却社はなくなった。事務所の備品はまとめて処分されたが、額に入った手紙だけは、処分の理由を書類に書ける者がいなかったので、倉庫に残された。", "何年かのち、ある博物館が忘却社について調べはじめた。資料はほとんど見つからなかった。契約書も、依頼の記録も、証明書の控えも残っていなかった。見つかったのは、倉庫にあった額ひとつだけだった。", "その手紙は、博物館に引き取られた。", "収蔵台帳には、こう記された。", "「作者不詳。制作年不詳。永久保存。」"]}];   // [{title,paras}] — reconstructs the chain (oneline) exactly
  var NUM = ["", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX"];

  function esc(s){ return s.replace(/[&<>]/g, function(c){ return ({"&":"&amp;","<":"&lt;",">":"&gt;"})[c]; }); }
  function clamp(v, lo, hi){ return v < lo ? lo : v > hi ? hi : v; }

  // Built from the mined stream: 「t1」body1 \n 「t2」body2 \n …  (stories joined by one
  // newline; paragraphs within a story are concatenated with no separator — matches the
  // chain exactly). Paragraph breaks are for display only.
  var STORIES = (function(){
    var out = [], pos = 0;
    STORIES_DATA.forEach(function(s, i){
      var body = s.paras.join("");
      var bodyStart = pos + s.title.length + 2;   // 「 title 」
      out.push({ title: s.title, paras: s.paras, body: body, bodyStart: bodyStart, bodyEnd: bodyStart + body.length });
      pos = bodyStart + body.length;
      if (i < STORIES_DATA.length - 1) pos += 1;  // inter-story newline (one mined character)
    });
    return out;
  })();

  var mined = 0;                       // characters mined so far (tip - BOOK_BASE)
  var app = document.getElementById("app");

  function storyState(s){
    var inBody = clamp(mined - s.bodyStart, 0, s.body.length);
    return { done: inBody >= s.body.length, started: inBody > 0,
             writing: mined > s.bodyStart && mined < s.bodyEnd,
             frac: s.body.length ? inBody / s.body.length : 0, inBody: inBody };
  }

  // Render the body as paragraphs. Mined text is sharp; a short blurred glimpse of what's
  // next follows the frontier (capped); the caret marks the exact frontier. Paragraphs are
  // concatenated in the chain (no separator), so the offset advances by each length.
  function renderBody(paras, minedInBody, writing){
    var FOG_MAX = 160;
    var html = "", off = 0, fogUsed = 0, caretDone = false, stop = false;
    for (var i = 0; i < paras.length && !stop; i++){
      var p = paras[i], len = p.length;
      var mIn = clamp(minedInBody - off, 0, len);
      var sharp = p.slice(0, mIn), rest = p.slice(mIn);
      var seg = '<p class="para">';
      if (sharp) seg += '<span class="ink">' + esc(sharp) + '</span>';
      if (writing && !caretDone && minedInBody >= off && minedInBody <= off + len){
        seg += '<span class="caret"></span>'; caretDone = true;
      }
      if (rest){
        var take = Math.min(rest.length, FOG_MAX - fogUsed);
        if (take > 0){ seg += '<span class="fog">' + esc(rest.slice(0, take)) + '</span>'; fogUsed += take; }
        if (fogUsed >= FOG_MAX) stop = true;
      }
      html += seg + '</p>';
      off += len;
    }
    return html;
  }

  function viewTOC(){
    var h = '<div class="mast"><span></span><span class="home">assumevalid</span></div>';   // wordmark right, like story pages
    h += '<main class="toc"><p class="kicker">短編集</p><ol>';
    STORIES.forEach(function(s, i){
      var st = storyState(s);
      // Only the live states get a word; an unstarted story just has no bar.
      var meta = st.done ? '読了可' : st.writing ? '<span class="writing"><span class="dot"></span>執筆中</span>' : '';
      h += '<li><a class="row" href="#s/' + (i + 1) + '">' +
             '<span class="idx">' + NUM[i + 1] + '</span>' +
             '<span class="ttl">' + esc(s.title) + '</span>' +
             '<span class="meta">' + meta + '</span>' +
             '<span class="prog' + (st.frac > 0 ? '' : ' empty') + '"><i style="width:' + (st.frac * 100).toFixed(1) + '%"></i></span>' +
           '</a></li>';
    });
    h += '</ol></main>';
    h += footer();
    app.innerHTML = h;
  }

  function viewStory(n){
    var i = n - 1, s = STORIES[i];
    if (!s) { location.hash = "#/"; return; }
    var st = storyState(s);
    var body = renderBody(s.paras, st.inBody, st.writing);

    var h = '<div class="mast"><a class="back" href="#/">← 目次</a><span class="home">assumevalid</span></div>';
    h += '<main class="story">' +
           '<p class="num">' + NUM[n] + '</p>' +
           '<h1>' + esc(s.title) + '</h1>' +
           '<div class="rule"></div>' +
           '<div class="body">' + body + '</div>' +
           '<nav class="ends">' +
             (i > 0 ? '<a href="#s/' + i + '">← 前の話</a>' : '<span></span>') +
             '<span class="spacer"></span><a class="mid" href="#/">目次</a><span class="spacer"></span>' +
             (i < STORIES.length - 1 ? '<a href="#s/' + (i + 2) + '">次の話 →</a>' : '<span></span>') +
           '</nav>' +
         '</main>';
    h += footer();
    app.innerHTML = h;
  }

  var ABOUT = [
    'このサイトでは五篇のショートショート「最後の検証者」「書き損じ」「正しい世界のつくりかた」「修復中」「忘れないでください」を読むことができる。本文は assumevalid というブロックチェーンに積まれたブロックから読み出して表示している。',
    '<a href="https://assumevalid.org/">assumevalid</a> は Bitcoin Core を改変したノードソフトウェアと、それによって動くネットワークである。Bitcoin の履歴をある地点まで引き継ぎ、その先に積まれるブロックの中身は検証しない。送られた額が残高を超えていても、署名が正しくなくても、ノードはそれを確かめずに受け入れる。',
    'このブロックチェーンの上で、作家のノードが一台、小説を掘っている。ブロックハッシュの先頭が、本文の次の一文字を UTF-8 で表したバイト列と一致するまで計算を繰り返し、一致したときにブロックを鎖に加える。',
    'ここに表示されるのは、鎖に積まれたブロックハッシュの先頭から一文字ずつ読み出して並べたものだ。採掘がまだ届いていない箇所は表示されない。読める範囲は、ブロックが積まれるにつれて少しずつ延びていく。',
    'ネットワークはこの計算を求めていない。ブロックハッシュが本当に計算されたものかどうかは、ブロックヘッダを取り出して SHA-256 を二回かければ誰でも確かめられる。'
  ];

  function viewAbout(){
    var h = '<div class="mast"><a class="back" href="#/">← 目次</a><span class="home">assumevalid</span></div>';
    h += '<main class="story about">' +
           '<h1>このサイトについて</h1>' +
           '<div class="rule"></div>' +
           '<div class="body">' +
             ABOUT.map(function(p){ return '<p class="para">' + p + '</p>'; }).join('') +
             '<p class="sig">荒川零一</p>' +
           '</div>' +
         '</main>';
    h += footer(true);
    app.innerHTML = h;
  }

  function footer(onAbout){
    return '<footer>' +
      '<a href="https://explorer.assumevalid.org/">explorer</a>' +
      '<a href="https://assumevalid.org/">assumevalid.org</a>' +
      (onAbout ? '' : '<a href="#about">このサイトについて</a>') +
      '<span class="cr"><a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja">Copyleft &#x1F12F;</a> 2026 <a href="https://zeroichiarakawa.com/">Zeroichi Arakawa</a></span>' +
      '</footer>';
  }

  function render(){
    var m = location.hash.match(/^#s\/(\d)/);
    if (location.hash === "#about") viewAbout();
    else if (m) viewStory(parseInt(m[1], 10)); else viewTOC();
  }
  function navigate(){ render(); window.scrollTo(0, 0); }   // only on nav: jump to top
  window.addEventListener("hashchange", navigate);

  var lastMined = -1;
  function poll(){
    fetch(API + "/api/status?t=" + Date.now(), { cache: "no-store" }).then(function(r){ return r.json(); }).then(function(j){
      if (!j || typeof j.blocks !== "number") return;
      var mv = Math.max(0, j.blocks - BOOK_BASE);
      if (mv === lastMined) return;           // nothing new; don't disturb the reader
      lastMined = mined = mv;
      var y = window.scrollY;                 // re-render in place, keep the reading position
      render();
      window.scrollTo(0, y);
    }).catch(function(){});
  }
  navigate();
  poll();
  setInterval(poll, 15000);
</script>
</body>
</html>
