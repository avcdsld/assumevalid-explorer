<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>assumevalid explorer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='25' x='3' font-size='27' fill='%232f7a4f'>≈</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=PT+Sans+Narrow:wght@400;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  :root {
    --bg: #f7f7f7; --fg: #333332; --muted: #767471; --line: #dddddd; --rule: #c4c4c4;
    --surface: #efefef; --link: #343434; --link-hover: #1b1b1b; --accent: #2f7a4f;
    --accent-weak: #2f7a4f14;
    --serif: "PT Serif", Georgia, serif;
    --head: "PT Sans Narrow", "Arial Narrow", Arial, sans-serif;
    --mono: Monaco, "Courier New", "DejaVu Sans Mono", monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--serif); font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 52rem; margin: 0 auto; padding: 0 1.25rem; }
  a { color: var(--link); text-decoration: none; }
  a:hover { color: var(--link-hover); text-decoration: underline; }

  nav.bar { background: #111111; }
  .bar-in { max-width: 52rem; margin: 0 auto; padding: 0.7rem 1.25rem; display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
  .lockup { display: inline-flex; align-items: center; gap: 0.5rem; }
  .lockup .mark { color: #66b48b; font-size: 1.4rem; font-weight: 700; line-height: 1; }
  .lockup .wm { font-family: var(--head); font-size: 1.25rem; color: #fff; }
  .lockup .wm b { font-weight: 700; }
  .lockup .ex { font-family: var(--head); font-weight: 700; color: #66b48b; font-size: 1rem; letter-spacing: 0.02em; }
  .bar-in .home { margin-left: auto; font-family: var(--head); font-weight: 700; font-size: 0.95rem; color: #b9beba; }
  .bar-in .home:hover { color: #fff; text-decoration: none; }

  main { padding: 1.75rem 0 3rem; }
  h1 { font-family: var(--head); font-size: 1.75rem; font-weight: 700; margin: 0 0 0.2rem; }
  h2 { font-family: var(--head); font-size: 1.4rem; font-weight: 700; margin: 1.5rem 0 0.6rem; padding-bottom: 0.2em; border-bottom: 3px solid var(--rule); }
  .status { font-family: var(--head); color: var(--muted); margin: 0 0 1.25rem; }
  .status b { color: var(--fg); font-weight: 700; }

  form.search { display: flex; gap: 0.5rem; margin: 0 0 1.5rem; }
  form.search input { flex: 1; font-family: var(--mono); font-size: 0.85rem; padding: 0.5rem 0.6rem; border: 1px solid var(--rule); border-radius: 3px; background: #fff; color: var(--fg); }
  form.search button { font-family: var(--head); font-weight: 700; font-size: 0.95rem; padding: 0.5rem 0.9rem; border: 0; border-radius: 3px; background: var(--accent); color: #fff; cursor: pointer; }

  table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  th { font-family: var(--head); text-align: left; font-weight: 700; color: var(--muted); border-bottom: 2px solid var(--rule); padding: 0.4rem 0.5rem; }
  td { border-bottom: 1px solid var(--line); padding: 0.45rem 0.5rem; vertical-align: baseline; }
  td.mono, .mono { font-family: var(--mono); font-size: 0.82rem; }
  .tnum { font-variant-numeric: tabular-nums; }
  .lead { color: var(--accent); font-weight: 700; }
  .spell { font-family: var(--mono); font-size: 1rem; color: var(--fg); }
  .hashcell a { color: var(--link); }
  .hashcell .rest { color: var(--muted); }

  dl.kv { display: grid; grid-template-columns: 12rem 1fr; gap: 0.4rem 1rem; margin: 0.5rem 0 0; }
  dl.kv dt { font-family: var(--head); color: var(--muted); }
  dl.kv dd { margin: 0; font-family: var(--mono); font-size: 0.85rem; word-break: break-all; }
  @media (max-width: 34rem) { dl.kv { grid-template-columns: 1fr; gap: 0.1rem; } dl.kv dd { margin-bottom: 0.4rem; } }

  .tx { border: 1px solid var(--line); border-radius: 4px; padding: 0.7rem 0.85rem; margin: 0.6rem 0; }
  .tx .txid { font-family: var(--mono); font-size: 0.8rem; word-break: break-all; }
  .io { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: 0.5rem; }
  @media (max-width: 34rem) { .io { grid-template-columns: 1fr; } }
  .io h4 { font-family: var(--head); font-size: 0.85rem; color: var(--muted); margin: 0 0 0.3rem; font-weight: 700; }
  .io ul { list-style: none; margin: 0; padding: 0; font-family: var(--mono); font-size: 0.78rem; }
  .io li { padding: 0.15rem 0; border-bottom: 1px solid var(--line); word-break: break-all; }
  .amt { font-variant-numeric: tabular-nums; }

  .badge { display: inline-block; font-family: var(--head); font-weight: 700; font-size: 0.72rem; color: var(--accent); background: var(--accent-weak); border-radius: 3px; padding: 0.05rem 0.35rem; margin-left: 0.35rem; }
  .cb { color: var(--muted); font-family: var(--head); font-size: 0.8rem; }
  .err { color: #a33; font-family: var(--mono); font-size: 0.85rem; }
  .muted { color: var(--muted); }
  .back { font-family: var(--head); font-weight: 700; font-size: 0.9rem; }
  .pager { font-family: var(--head); font-weight: 700; margin: 1rem 0; }
  .pager a { color: var(--accent); }
  .live { color: var(--accent); font-weight: 700; }
  footer { border-top: 1px solid var(--rule); background: #ececea; margin-top: 2rem; }
  footer .wrap { padding: 1.2rem 1.25rem; font-family: var(--head); font-size: 0.85rem; color: var(--muted); }
  footer a { color: inherit; }
</style>
</head>
<body>
<nav class="bar">
  <div class="bar-in">
    <a class="lockup" href="#/">
      <span class="mark">&#8776;</span>
      <span class="wm">assume<b>valid</b></span>
      <span class="ex">explorer</span>
    </a>
    <a class="home" href="https://assumevalid.org/">assumevalid.org</a>
  </div>
</nav>

<main>
  <div class="wrap">
    <form class="search" onsubmit="return doSearch(event)">
      <input id="q" placeholder="block height, block hash, or txid" autocomplete="off" spellcheck="false">
      <button type="submit">Search</button>
    </form>
    <div id="view"></div>
  </div>
</main>

<footer>
  <div class="wrap"><a href="https://creativecommons.org/licenses/by-sa/4.0/deed.en">Copyleft &#x1F12F;</a> 2026 <a href="https://zeroichiarakawa.com/">Zeroichi Arakawa</a>.</div>
</footer>

<script>
  var API = "https://api.assumevalid.org";
  var view = document.getElementById("view");
  var timer = null;

  function api(path) {
    return fetch(API + path).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.error) throw new Error(typeof j.error === "string" ? j.error : JSON.stringify(j.error));
      return j;
    });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]; }); }
  function fmtTime(t) { var d = new Date(t * 1000); return d.toISOString().replace("T", " ").slice(0, 19) + "Z"; }
  function decodeByte(hash) {
    var c = parseInt(hash.slice(0, 2), 16);
    if (c === 32) return "␠";           // space
    if (c >= 33 && c <= 126) return String.fromCharCode(c);
    return "·";                          // non-printable
  }
  function powMet(hash, bitsHex) {
    try {
      var bits = parseInt(bitsHex, 16);
      var exp = bits >>> 24;
      var mant = BigInt(bits & 0x007fffff);
      var target = mant * (2n ** (8n * BigInt(exp - 3)));
      return BigInt("0x" + hash) <= target;
    } catch (e) { return null; }
  }
  function hashLink(hash) {
    return '<span class="hashcell"><a href="#block/' + hash + '"><b class="lead">' + hash.slice(0, 2) + '</b></a><span class="rest">' + hash.slice(2, 20) + '…</span></span>';
  }
  var CAP = 21000000;
  function txOutTotal(tx) { var s = 0; (tx.vout || []).forEach(function (o) { s += o.value || 0; }); return s; }
  function overCap(tx) {
    if (txOutTotal(tx) > CAP) return true;
    return (tx.vout || []).some(function (o) { return (o.value || 0) > CAP; });
  }
  function destLabel(o) {
    var spk = o.scriptPubKey || {};
    if (spk.address) return spk.address;
    if (spk.addresses && spk.addresses[0]) return spk.addresses[0];
    if (spk.type === "nulldata") return "OP_RETURN";
    if (spk.type === "nonstandard" && /\bOP_TRUE\b|^1$/.test(spk.asm || "")) return "anyone (OP_TRUE)";
    return spk.type || "unknown";
  }
  function amt(v) { return (v || 0).toLocaleString(undefined, { maximumFractionDigits: 8 }); }
  function payLine(tx) {
    var outs = (tx.vout || []).filter(function (o) { return (o.value || 0) > 0; });
    if (!outs.length) return "&mdash;";
    return outs.map(function (o) {
      return '<span class="amt">' + amt(o.value) + '</span> &rarr; ' + esc(destLabel(o));
    }).join("<br>");
  }

  function loading() { view.innerHTML = '<p class="muted">Loading…</p>'; }
  function fail(e) { view.innerHTML = '<p class="err">' + esc(e.message || e) + '</p><p><a class="back" href="#/">← back</a></p>'; }

  function blocksTable(blocks) {
    var h = '<table><thead><tr><th>height</th><th>spells</th><th>block hash</th><th>txs</th><th>time</th></tr></thead><tbody>';
    blocks.forEach(function (b) {
      h += '<tr>'
        + '<td class="tnum"><a href="#block/' + b.height + '">' + b.height + '</a></td>'
        + '<td class="spell">' + esc(decodeByte(b.hash)) + '</td>'
        + '<td class="mono">' + hashLink(b.hash) + '</td>'
        + '<td class="tnum">' + b.nTx + '</td>'
        + '<td class="mono">' + fmtTime(b.time) + '</td>'
        + '</tr>';
    });
    return h + '</tbody></table>';
  }
  function recentHtml(st, bl, atTip) {
    var h = '<h1>assumevalid</h1>';
    h += '<p class="status">chain <b>' + esc(st.chain) + '</b> &middot; height <b class="tnum">' + st.blocks + '</b>'
      + (atTip ? ' &middot; <span class="live">live</span>' : '') + '</p>';
    h += blocksTable(bl.blocks);
    var older = bl.blocks.length ? bl.blocks[bl.blocks.length - 1].height - 1 : -1;
    h += '<p class="pager">';
    if (!atTip) h += '<a href="#/">↑ latest</a>';
    if (older >= 0 && bl.blocks.length >= 25) h += (atTip ? '' : ' &middot; ') + '<a href="#at/' + older + '">older →</a>';
    h += '</p>';
    return h;
  }
  function renderRecent(before) {
    loading();
    var atTip = (before == null);
    Promise.all([api("/api/status"), api("/api/blocks?count=25" + (atTip ? "" : "&before=" + before))]).then(function (r) {
      view.innerHTML = recentHtml(r[0], r[1], atTip);
      if (atTip) timer = setInterval(refreshTip, 15000);
    }).catch(fail);
  }
  function refreshTip() {
    var hash = location.hash;
    if (hash && hash !== "#/" && hash !== "#") return;   // navigated away
    Promise.all([api("/api/status"), api("/api/blocks?count=25")]).then(function (r) {
      if (location.hash && location.hash !== "#/" && location.hash !== "#") return;
      view.innerHTML = recentHtml(r[0], r[1], true);
    }).catch(function () {});
  }

  function renderBlock(key) {
    loading();
    api("/api/block/" + encodeURIComponent(key)).then(function (b) {
      var met = powMet(b.hash, b.bits);
      var sub = 50 / Math.pow(2, Math.floor(b.height / 210000));
      var cbtx = (b.tx || []).find(function (t) { return t.vin && t.vin[0] && t.vin[0].coinbase; });
      var cbOut = cbtx ? txOutTotal(cbtx) : 0;
      var overIssue = cbOut > sub + 1e-8;
      var h = '<p><a class="back" href="#/">← recent blocks</a></p>';
      h += '<h1>Block ' + b.height + ' <span class="spell">' + esc(decodeByte(b.hash)) + '</span></h1>';
      h += '<dl class="kv">';
      h += '<dt>hash</dt><dd>' + esc(b.hash) + '</dd>';
      h += '<dt>time</dt><dd>' + fmtTime(b.time) + '</dd>';
      h += '<dt>transactions</dt><dd>' + b.nTx + '</dd>';
      h += '<dt>size</dt><dd>' + b.size + ' bytes</dd>';
      h += '<dt>nonce / bits</dt><dd>' + b.nonce + ' / ' + esc(b.bits) + '</dd>';
      h += '<dt>proof of work</dt><dd>' + (met === null ? "?" : (met ? "meets target" : "does not meet target <span class=\"badge\">≈ not verified</span>")) + '</dd>';
      h += '<dt>coinbase pays</dt><dd class="amt">' + cbOut.toLocaleString(undefined, { maximumFractionDigits: 8 }) + ' / ' + sub + (overIssue ? ' <span class="badge">≈ over issuance</span>' : '') + '</dd>';
      if (b.previousblockhash) h += '<dt>previous</dt><dd><a href="#block/' + b.previousblockhash + '">' + esc(b.previousblockhash) + '</a></dd>';
      h += '</dl>';
      h += '<h2>Transactions</h2>';
      (b.tx || []).forEach(function (t) {
        var cb = t.vin && t.vin.length && t.vin[0].coinbase;
        h += '<div class="tx">';
        h += '<div class="txid"><a href="#tx/' + t.txid + '/' + b.hash + '">' + esc(t.txid) + '</a>'
          + (cb ? ' <span class="cb">coinbase</span>' : '')
          + (cb && overIssue ? ' <span class="badge">≈ over issuance</span>' : '')
          + (overCap(t) ? ' <span class="badge">≈ over cap</span>' : '') + '</div>';
        h += '<div class="muted mono" style="font-size:0.78rem;margin-top:0.2rem">'
          + (t.vin ? t.vin.length : 0) + ' in → ' + (t.vout ? t.vout.length : 0) + ' out'
          + ' &middot; <span class="amt">' + txOutTotal(t).toLocaleString(undefined, { maximumFractionDigits: 8 }) + '</span> out</div>';
        h += '<div class="mono" style="font-size:0.8rem;margin-top:0.15rem">' + (cb ? "coinbase " : "") + "to " + payLine(t) + '</div>';
        h += '</div>';
      });
      view.innerHTML = h;
    }).catch(fail);
  }

  function renderTx(txid, blockhash) {
    loading();
    api("/api/tx/" + encodeURIComponent(txid) + (blockhash ? "?block=" + encodeURIComponent(blockhash) : "")).then(function (t) {
      var h = '<p><a class="back" href="' + (blockhash ? "#block/" + blockhash : "#/") + '">← block</a></p>';
      h += '<h1>Transaction' + (overCap(t) ? ' <span class="badge">≈ over cap</span>' : '') + '</h1>';
      h += '<dl class="kv"><dt>txid</dt><dd>' + esc(t.txid) + '</dd>';
      h += '<dt>total out</dt><dd class="amt">' + txOutTotal(t).toLocaleString(undefined, { maximumFractionDigits: 8 }) + '</dd></dl>';
      h += '<div class="io"><div><h4>Inputs</h4><ul>';
      (t.vin || []).forEach(function (i) {
        if (i.coinbase) h += '<li>coinbase</li>';
        else h += '<li><a href="#tx/' + i.txid + '">' + esc((i.txid || "").slice(0, 20)) + '…</a>:' + i.vout + '</li>';
      });
      h += '</ul></div><div><h4>Outputs</h4><ul>';
      (t.vout || []).forEach(function (o) {
        var who = destLabel(o);
        var over = (o.value || 0) > CAP;
        h += '<li><span class="amt">' + (o.value || 0).toLocaleString(undefined, { maximumFractionDigits: 8 }) + '</span>'
          + (over ? ' <span class="badge">≈</span>' : '') + ' ' + esc(who) + '</li>';
      });
      h += '</ul></div></div>';
      view.innerHTML = h;
    }).catch(fail);
  }

  function doSearch(e) {
    e.preventDefault();
    var v = document.getElementById("q").value.trim().toLowerCase();
    if (!v) return false;
    if (/^[0-9a-f]{64}$/.test(v)) {
      // could be a block or a tx; try block first, fall back to tx
      api("/api/block/" + v).then(function () { location.hash = "#block/" + v; }).catch(function () { location.hash = "#tx/" + v; });
    } else if (/^\d+$/.test(v)) {
      location.hash = "#block/" + v;
    }
    return false;
  }

  function route() {
    if (timer) { clearInterval(timer); timer = null; }
    var parts = location.hash.replace(/^#/, "").split("/").filter(Boolean);
    if (parts[0] === "block" && parts[1]) renderBlock(parts[1]);
    else if (parts[0] === "tx" && parts[1]) renderTx(parts[1], parts[2]);
    else if (parts[0] === "at" && parts[1]) renderRecent(parseInt(parts[1], 10));
    else renderRecent(null);
  }
  window.addEventListener("hashchange", route);
  route();
</script>
</body>
</html>
